name: Deploy to GCS

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: gcs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload index.html
        run: |
          gcloud storage cp index.html gs://stuff.hiccup.nl/rainwater/index.html \
            --content-type=text/html \
            --cache-control="public, max-age=60, must-revalidate"

      - name: Upload styles.css
        run: |
          gcloud storage cp styles.css gs://stuff.hiccup.nl/rainwater/styles.css \
            --content-type=text/css \
            --cache-control="public, max-age=300"

      - name: Upload app.js
        run: |
          gcloud storage cp app.js gs://stuff.hiccup.nl/rainwater/app.js \
            --content-type=application/javascript \
            --cache-control="public, max-age=300"

      - name: Grant public read on objects
        run: |
          gcloud storage objects update \
            gs://stuff.hiccup.nl/rainwater/index.html \
            gs://stuff.hiccup.nl/rainwater/styles.css \
            gs://stuff.hiccup.nl/rainwater/app.js \
            --add-acl-grant=entity=AllUsers,role=READER
